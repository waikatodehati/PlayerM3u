<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U Player Premium</title>
    <!-- Memuatkan Tailwind CSS untuk gaya antaramuka yang moden -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuatkan HLS.js untuk menyokong penstriman format .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Gaya tambahan untuk scrollbar supaya lebih kemas (tema gelap untuk overlay) */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5); 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div id="notification-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Pengepala (Header) -->
        <div class="bg-indigo-600 p-4 text-white flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Pemain M3U Web
            </h1>
            <span class="text-indigo-200 text-xs md:text-sm font-medium bg-indigo-800/50 px-3 py-1 rounded-full border border-indigo-500/30">
                Premium Edition
            </span>
        </div>

        <!-- Bahagian Pemain Video Utama -->
        <div class="relative bg-black w-full aspect-video flex items-center justify-center overflow-hidden group">
            
            <video id="videoPlayer" class="w-full h-full object-contain" controls></video>
            
            <!-- Mesej placeholder apabila tiada video dimainkan -->
            <div id="videoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none z-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 4v16l13-8-13-8z" />
                </svg>
                <span class="text-sm md:text-base font-medium">Sila muat naik fail M3U dan pilih video untuk mula menonton</span>
            </div>

            <!-- Butang Buka/Tutup Senarai Main (Overlay atas video) -->
            <button id="togglePlaylistBtn" class="absolute top-4 right-4 bg-slate-900/70 hover:bg-slate-900 text-white p-2.5 rounded-lg backdrop-blur-md z-20 transition-all border border-slate-700 shadow-lg" title="Buka Senarai Main">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                    </svg>
                    <span id="videoCountBadge" class="hidden md:inline-block text-xs font-bold bg-indigo-500 px-1.5 py-0.5 rounded">0</span>
                </div>
            </button>

            <!-- Panel Senarai Main (Overlay di sebelah kanan video dengan Auto-Hide) -->
            <div id="playlistPanel" class="absolute top-0 right-0 bottom-0 w-full md:w-80 bg-slate-900/95 backdrop-blur-xl border-l border-slate-700 transform translate-x-full transition-transform duration-300 ease-in-out z-10 flex flex-col shadow-2xl">
                
                <!-- Pengepala Senarai Main -->
                <div class="p-4 border-b border-slate-700 flex flex-col gap-3">
                    <div class="flex items-center justify-between text-white">
                        <h3 class="font-bold flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                            </svg>
                            Senarai Main
                        </h3>
                        <button id="closePlaylistBtn" class="text-slate-400 hover:text-white transition-colors p-1 md:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="text" id="searchInput" placeholder="Cari saluran/video..." class="w-full pl-9 pr-3 py-2 bg-slate-800 border border-slate-600 text-white placeholder-slate-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-all" disabled>
                    </div>
                </div>

                <!-- Senarai Video -->
                <ul id="playlist" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                    <li class="p-4 text-center text-slate-500 text-sm italic mt-10">
                        Sila muat naik fail M3U untuk memaparkan senarai.
                    </li>
                </ul>
            </div>
        </div>

        <!-- Bahagian Kawalan Fail (Bawah Pemain) -->
        <div class="p-4 md:p-6 bg-slate-50 border-t border-slate-200">
            <div class="flex flex-col md:flex-row gap-6 items-start md:items-center">
                
                <!-- Muat Naik Fail -->
                <div class="flex-1 w-full space-y-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Muat Naik Fail Tempatan</label>
                    <div class="flex gap-2">
                        <label class="flex-1 cursor-pointer bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 py-2.5 px-4 rounded-lg font-medium transition-colors text-center shadow-sm flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <span id="fileNameDisplay" class="truncate max-w-[150px] md:max-w-[200px]">Pilih Fail .M3U</span>
                            <input type="file" id="fileInput" accept=".m3u,.m3u8" class="hidden">
                        </label>
                        <button onclick="kosongkanList()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 py-2.5 px-4 rounded-lg font-medium transition-colors shadow-sm flex items-center justify-center" title="Reset Senarai">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Pemisah untuk Mobile -->
                <div class="hidden md:block w-px h-12 bg-slate-300"></div>

                <!-- Muat Turun URL -->
                <div class="flex-1 w-full space-y-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Muat Turun Dari URL</label>
                    <div class="flex gap-2">
                        <input type="text" id="urlInput" placeholder="https://contoh.com/playlist.m3u" class="flex-1 px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm shadow-sm transition-all">
                        <button onclick="muatTurunDariUrl()" id="btnMuatTurun" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 px-5 rounded-lg font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            <span class="hidden sm:inline">Muat Turun</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Deklarasi Elemen DOM
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const playlistEl = document.getElementById('playlist');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const searchInput = document.getElementById('searchInput');
        const urlInput = document.getElementById('urlInput');
        const btnMuatTurun = document.getElementById('btnMuatTurun');
        
        // Elemen Overlay Senarai Main
        const playlistPanel = document.getElementById('playlistPanel');
        const togglePlaylistBtn = document.getElementById('togglePlaylistBtn');
        const closePlaylistBtn = document.getElementById('closePlaylistBtn');
        const videoCountBadge = document.getElementById('videoCountBadge');

        // Pembolehubah Global
        let senaraiVideoKeseluruhan = []; // Menyimpan semua data video yang diekstrak
        let hlsObj = null; // Menyimpan instance HLS.js
        let currentPlayingUrl = ''; // Memantau video yang sedang dimainkan
        let isPlaylistOpen = false;

        // --- LOGIK OVERLAY SENARAI MAIN ---
        function togglePlaylist(forceState = null) {
            if (forceState !== null) {
                isPlaylistOpen = forceState;
            } else {
                isPlaylistOpen = !isPlaylistOpen;
            }

            if (isPlaylistOpen) {
                playlistPanel.classList.remove('translate-x-full');
                togglePlaylistBtn.classList.add('bg-indigo-600', 'border-indigo-500');
                togglePlaylistBtn.classList.remove('bg-slate-900/70', 'border-slate-700');
            } else {
                playlistPanel.classList.add('translate-x-full');
                togglePlaylistBtn.classList.remove('bg-indigo-600', 'border-indigo-500');
                togglePlaylistBtn.classList.add('bg-slate-900/70', 'border-slate-700');
            }
        }

        togglePlaylistBtn.addEventListener('click', () => togglePlaylist());
        closePlaylistBtn.addEventListener('click', () => togglePlaylist(false));

        // Fungsi untuk memaparkan notifikasi pop-up
        function paparNotifikasi(mesej, jenis = 'berjaya') {
            const container = document.getElementById('notification-container');
            if (!container) return;

            const notif = document.createElement('div');
            const bgClass = jenis === 'berjaya' ? 'bg-emerald-500' : 'bg-red-500';
            const icon = jenis === 'berjaya' 
                ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';

            notif.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0`;
            notif.innerHTML = `${icon} <span class="font-medium text-sm">${mesej}</span>`;

            container.appendChild(notif);

            setTimeout(() => notif.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => {
                notif.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => notif.remove(), 300);
            }, 3500);
        }

        // 1. Fungsi Membaca Fail M3U
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = file.name;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const content = e.target.result;
                parseM3U(content);
            };
            reader.readAsText(file);
        });

        // 1.5 Fungsi Muat Turun M3U dari Pautan (URL)
        async function muatTurunDariUrl() {
            const url = urlInput.value.trim();
            if (!url) {
                paparNotifikasi("Sila masukkan URL yang sah terlebih dahulu.", "gagal");
                return;
            }

            // Tukar ikon butang kepada animasi memuatkan
            const originalBtnHTML = btnMuatTurun.innerHTML;
            btnMuatTurun.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="hidden sm:inline">Memuatkan...</span>`;
            btnMuatTurun.disabled = true;

            let content = '';

            try {
                try {
                    const proxy1 = 'https://corsproxy.io/?' + encodeURIComponent(url);
                    const response1 = await fetch(proxy1);
                    if (!response1.ok) throw new Error('Proksi 1 gagal');
                    content = await response1.text();
                } catch (err1) {
                    console.log("Proksi 1 gagal, mencuba Proksi 2...");
                    const proxy2 = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
                    const response2 = await fetch(proxy2);
                    if (!response2.ok) throw new Error('Kedua-dua proksi disekat.');
                    
                    const data = await response2.json();
                    if (!data.contents) throw new Error('Tiada kandungan teks ditemui.');
                    content = data.contents;
                }

                if (!content || (!content.includes('#EXTM3U') && !content.includes('#EXTINF') && !content.includes('http'))) {
                     throw new Error('Pautan diakses, tetapi bukan format M3U yang sah.');
                }

                let filename = url.substring(url.lastIndexOf('/') + 1);
                if (!filename || filename.length > 25 || !filename.includes('.')) filename = "Senarai URL M3U";
                fileNameDisplay.textContent = filename;
                
                parseM3U(content);
                paparNotifikasi(`Berjaya memuat turun ${senaraiVideoKeseluruhan.length} saluran/video!`, 'berjaya');

            } catch (error) {
                paparNotifikasi("Gagal memuat turun! Sila muat turun fail M3U tersebut ke peranti anda secara manual.", "gagal");
                playlistEl.innerHTML = `
                    <li class="p-4 text-center text-red-400 text-sm font-medium border border-red-500/30 bg-red-900/20 rounded-lg m-2">
                        Gagal memuat turun data!<br>
                        <span class="text-xs font-normal text-slate-400 mt-2 block">Sila muat turun fail .m3u secara manual dan gunakan butang "Pilih Fail M3U".</span>
                    </li>`;
                videoCountBadge.textContent = '0';
                searchInput.disabled = true;
                togglePlaylist(true); // Buka senarai main untuk tunjuk ralat
            } finally {
                btnMuatTurun.innerHTML = originalBtnHTML;
                btnMuatTurun.disabled = false;
            }
        }

        // 2. Fungsi Ekstrak dan Proses Data M3U
        function parseM3U(content) {
            const lines = content.split('\n');
            senaraiVideoKeseluruhan = []; 
            let currentTitle = 'Video Tanpa Tajuk';

            lines.forEach((line) => {
                line = line.trim();
                if (line.length === 0) return; 

                if (line.startsWith('#EXTINF:')) {
                    const commaIndex = line.indexOf(',');
                    if (commaIndex !== -1) {
                        currentTitle = line.substring(commaIndex + 1).trim() || 'Video Tanpa Tajuk';
                    }
                } else if (!line.startsWith('#')) {
                    senaraiVideoKeseluruhan.push({
                        title: currentTitle,
                        url: line
                    });
                    currentTitle = 'Video Tanpa Tajuk';
                }
            });

            if (senaraiVideoKeseluruhan.length > 0) {
                searchInput.disabled = false; 
                searchInput.value = ''; 
                paparSenarai(senaraiVideoKeseluruhan);
                togglePlaylist(true); // Automatik buka senarai main lepas muat naik
            } else {
                playlistEl.innerHTML = '<li class="p-4 text-center text-red-400 text-sm">Format M3U tidak sah atau fail kosong.</li>';
                videoCountBadge.textContent = '0';
                searchInput.disabled = true;
            }
        }

        
        // 3. Fungsi Memaparkan Senarai ke dalam HTML
        function paparSenarai(dataArray) {
            playlistEl.innerHTML = ''; 
            videoCountBadge.textContent = dataArray.length;

            if (dataArray.length === 0) {
                playlistEl.innerHTML = '<li class="p-4 text-center text-slate-400 text-sm">Tiada video padan dengan carian.</li>';
                return;
            }

            const fragment = document.createDocumentFragment();

            dataArray.forEach((video) => {
                const li = document.createElement('li');
                
                // Gayakan senarai (Tema Gelap)
                const isActive = (video.url === currentPlayingUrl);
                li.className = `p-3 rounded-lg cursor-pointer text-sm font-medium transition-all border-l-4 ${
                    isActive 
                    ? 'bg-indigo-600/30 border-indigo-400 text-white' 
                    : 'bg-transparent border-transparent hover:bg-slate-800 text-slate-300 hover:text-white'
                }`;
                
                li.textContent = video.title;
                li.onclick = () => mainkanVideo(li, video.url);
                fragment.appendChild(li);
            });

            playlistEl.appendChild(fragment);
        }

        // 4. Logik Fungsi Carian
        searchInput.addEventListener('input', function(e) {
            const kataKunci = e.target.value.toLowerCase();
            const senaraiDitapis = senaraiVideoKeseluruhan.filter(video => 
                video.title.toLowerCase().includes(kataKunci)
            );
            paparSenarai(senaraiDitapis);
        });

        
        // 5. Fungsi Memainkan Video
        function mainkanVideo(element, url) {
            currentPlayingUrl = url;
            videoPlaceholder.style.display = 'none'; 
            
            // Auto hide playlist apabila video dimainkan pada semua peranti
            togglePlaylist(false);
            
            // Kemas kini gaya item yang dipilih (Tema Gelap)
            document.querySelectorAll('#playlist li').forEach(el => {
                el.className = 'p-3 rounded-lg cursor-pointer text-sm font-medium transition-all border-l-4 bg-transparent border-transparent hover:bg-slate-800 text-slate-300 hover:text-white';
            });
            
            if(element) {
                element.className = 'p-3 rounded-lg cursor-pointer text-sm font-medium transition-all border-l-4 bg-indigo-600/30 border-indigo-400 text-white';
            }

            if (hlsObj) {
                hlsObj.destroy();
            }

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsObj = new Hls();
                hlsObj.loadSource(url);
                hlsObj.attachMedia(videoPlayer);
                hlsObj.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play().catch(e => console.log("Autoplay dihalang pelayar:", e));
                });
            } 
            else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = url;
                videoPlayer.addEventListener('loadedmetadata', function() {
                    videoPlayer.play().catch(e => console.log("Autoplay dihalang:", e));
                });
            } 
            else {
                videoPlayer.src = url;
                videoPlayer.play().catch(e => console.log("Ralat memainkan media:", e));
            }
        }

        // Auto-tutup senarai main apabila klik di kawasan luar panel (pada paparan video)
        videoPlayer.addEventListener('click', function() {
            if (isPlaylistOpen) {
                togglePlaylist(false);
            }
        });

        // 6. Fungsi Butang Reset
        function kosongkanList() {
            senaraiVideoKeseluruhan = [];
            currentPlayingUrl = '';
            
            playlistEl.innerHTML = '<li class="p-4 text-center text-slate-500 text-sm italic mt-10">Senarai telah dikosongkan.</li>';
            videoCountBadge.textContent = '0';
            fileNameDisplay.textContent = 'Pilih Fail .M3U';
            fileInput.value = '';
            searchInput.value = '';
            searchInput.disabled = true;
            if (urlInput) urlInput.value = ''; 
            
            if (hlsObj) hlsObj.destroy();
            videoPlayer.src = '';
            videoPlaceholder.style.display = 'flex';
            togglePlaylist(false);
            paparNotifikasi("Senarai main telah ditetapkan semula (reset).", "berjaya");
        }
    </script>
</body>
</html>
